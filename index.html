<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.0/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="weather.css">
</head>
<body class="bg-dark text-white min-vh-100">
    <h1 class="display-3 text-primary text-center mt-4">
        Weather Application
    </h1>
    <form id="myform" class="text-center">
        <input type="text" placeholder="Enter City" id="city"
            class="form-control bg-dark text-white border-primary rounded-3 mx-auto my-3 w-50">
        <br>
        <button id="btn" class="btn btn-outline-primary fw-bold rounded-pill px-5 py-2">
            Get Weather
        </button>
        <section id="result1"></section>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUV0sF0A7MsXsP1UyJoMpMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
        </script>
    <script src="weather.js"></script>

</body>

</html>
