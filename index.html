<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.0/dist/axios.min.js"></script>
    <link rel="stylesheet" href="weather.css">
</head>

<body>
    <h1 style="font-size: 50px; color: blue;">Weather Application</h1>
    <form id="myform">
        <input type="text" placeholder="Enter City" id="city">
        <br>
        <button id="btn">Get Weather</button>
        <section id="result">
            <div id="heading">
                <p class="para" > Temparature :</p>
                <p class="para" > Feels_like :</p>
                <p class="para" > Humidity :</p>
                <p class="para" > Pressure :</p>
                <p class="para">Weather :</p>
                <p class="para">Description :</p>
            </div>
            <div id="values">
                <p class="para" id="data4"></p>
                <p class="para" id="data1"></p>
                <p class="para" id="data2"></p>
                <p class="para" id="data3"></p>
                <p class="para" id="data5"></p>
                <p class="para" id="data6"></p>
            </div>
        </section>
    </form>


    <script src="weather.js"></script>
</body>

</html>
